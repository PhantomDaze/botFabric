runtime:
  plugin_directory: ./config/plugins
  shutdown_timeout: 10s
  default_handler_timeout: 2s
  bot_id: mock-bot

transport:
  unix_socket_directory: ./run
  max_message_size: 4MiB

policy:
  file: ./config/policy.example.yaml
  default: deny

observability:
  log_format: json
  metrics_enabled: false # 启用后通过独立 HTTP 端点暴露 Prometheus 指标
  metrics_listen_address: 127.0.0.1:9091 # 启用指标时必填；建议仅绑定回环或内网地址
  tracing_enabled: false

onebot:
  enabled: false
  listen_address: 127.0.0.1:8090
  path_v11: /onebot/v11
  path_v12: /onebot/v12
  access_token: change-me
  connect_timeout: 10s
  heartbeat_interval: 30s
  max_message_size: 4MiB
  write_timeout: 5s # 数据帧写超时；0 表示不限

application_onebot:
  enabled: false
  mode: server # server / client / both
  listen_address: 127.0.0.1:8091
  path_v11: /application/v11
  path_v12: /application/v12
  access_token: change-me
  read_timeout: 10s
  write_timeout: 5s
  heartbeat_interval: 30s # 0 表示不心跳（向后兼容）
  remote_address: 127.0.0.1:8092
  remote_path: /onebot
  remote_version: v11
  reconnect_interval: 2s # 0 表示不自动重连；>0 启用指数退避
  reconnect_max_interval: 16s
  reconnect_max_tries: 0 # 0 表示无限重连
  max_message_size: 4MiB # 单条读消息上限，超过则断开连接；默认 4MiB，最大 64MiB

redis:
  enabled: false # 关闭时去重与响应状态回退到进程内内存实现
  address: 127.0.0.1:6379
  password: ""
  db: 0
  key_prefix: "botfabric:" # 多实例共享 Redis 时的命名空间隔离

management:
  enabled: false
  listen_address: 127.0.0.1:9090
  bearer_token: change-me-in-production
