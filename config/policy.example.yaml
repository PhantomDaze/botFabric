default: deny
plugins:
  protocol.mockonebot:
    publish:
      - bot.message.group
    subscribe: []
    invoke: []
    provide:
      - protocol.qq.action

  protocol.onebot:
    publish:
      - bot.message.group
    subscribe: []
    invoke: []
    provide:
      - protocol.qq.action

  # 应用端适配器使用固定的内部动作调用主体，不采用客户端声明的端点 ID。
  application.onebot:
    publish: []
    subscribe: []
    invoke:
      - service: protocol.qq.action
        methods:
          - SendMessage
    provide: []

  example.reply:
    publish: []
    subscribe:
      - bot.message.group
    invoke:
      - service: botfabric.response
        methods:
          - Submit
          - Cancel
      - service: protocol.qq.action
        methods:
          - SendMessage
    provide: []
